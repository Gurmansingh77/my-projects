                <h3>Daily task manager</h3>
            </div>

                <button class="dashbordbtn">Dashboard</button>

        </div>

        <div class="right">

                            Light mode</button>
                    </div>
                </nav>
            </header>

            <div class="data">

                <div class="totaltask databtns">
                    <h2>Total task</h2>
                    <h1 class="totaltaskcount">00</h1>
                </div>
                <div class="completed databtns">
                    <h2>Completed</h2>
                    <h1 class="completecount">00</h1>
                </div>
                <div class="pending databtns">
                    <h2>pending</h2>
                    <h1 class="pendingcount">00</h1>
                </div>

            </div>

            <div class="addtasks">
                <div class="add">
                    <input class="input" type="text" placeholder="Type a new task here......">
                    <button class="addbtn btn">Add</button>
                    <button class="clearbtn btn">Clear All</button>
                </div>
            </div>

            <div class="alltasksection">
                <div class="heading"><h1>Task List</h1></div>

                <div class="taskcontainer">
