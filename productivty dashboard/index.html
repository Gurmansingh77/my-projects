<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main>
        <div class="firstview">
            <div class="register">
                <h2>What's your good name</h2>
                <form action="">
                    <input type="text" class="nameinput" placeholder="Your name...">
                    <button class="continuebtn">Continue</button>
                </form>
            </div>
        </div>

        <div class="aftertaskclickinterface">

            <div class="box">
                <div class="headline">
                    <h2>Task</h2>
                    <svg class="cross" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
                        color="#000000" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"></path>
                    </svg>
                </div>

                <div class="mainbox">
                    <form class="taskform" action="">

                        <input class="taskinput" type="text" placeholder="Add a task">
                        <button type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
                                color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12Z">
                                </path>
                                <path d="M12 8V16M16 12H8"></path>
                            </svg>
                        </button>
                    </form>

                    <div class="listtray">
                        <button class="alltask">All</button>
                        <button class="activebtn">Active</button>
                        <button class="completedbtn">Completed</button>
                    </div>

                    <div class="tasklist">
                        <div class="title">Task List</div>
                        <div class="tasksection">

                            <!-- <div class="tasks">
                                <h2 class="tasktitle" style="font-size: small; font-weight: normal; "></h2>
                                <div class="btns">
                                    <button>done</button>
                                    <button>delete</button>
                                </div>
                            </div> -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="afterplannerclickinterface">
            <div class="plannerbox">

                <div class="topline">
                    <h2>Planner</h2>
                    <svg class="plannercross" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30"
                        height="30" color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"></path>
                    </svg>
                </div>

                <div class="mainplanner">
                    <form class="plannerform" action="">
                        <input class="timepicker" type="time">
                        <input class="eventinput" type="text" placeholder="Type your event...">
                        <button type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"
                                color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12Z">
                                </path>
                                <path d="M12 8V16M16 12H8"></path>
                            </svg>
                        </button>
                    </form>
                </div>

                <div class="eventlist">
                    <div class="event">
                        <!-- <div class="eventtime">1:22AM</div>
                        <div class="eventname">BIRTHDAY</div>
                        <div class="delevent">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20"
                                height="20" color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"></path>
                            </svg>
                        </div> -->
                    </div>

                </div>
            </div>
        </div>

        <div class="aftergoalclickinterface">
            <div class="goalbox">

                <div class="goalheadline">
                    <h2 >Goals</h2>
                    <div class="closegoals">
                        <svg class="plannercross" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30"
                            height="30" color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"></path>
                        </svg>
                    </div>
                </div>

                <div class="maingoal">
                    <form class="goalform" action="">

                        <input class="goalinput" type="text" placeholder="Add a goal">
                        <button type="submit">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30"
                                color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12Z">
                                </path>
                                <path d="M12 8V16M16 12H8"></path>
                            </svg>
                        </button>
                    </form>
                </div>

                <div class="goalarea">
                    <!-- <div class="goalslist">
                        <div class="goaltext">
                            <h2>goal</h2>
                        </div>
                        <div class="delgoal">
                            <svg class="plannercross" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30"
                                height="30" color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"></path>
                            </svg>
                        </div>
                    </div> -->

                </div>

                <footer class="goalfooter">
                    <h4 style="font-size: 14px; font-weight: normal; opacity: 0.8; ">Total Goals - </h4>
                </footer>
            </div>
        </div>

        <div class="afterpomodoroclickinterface">
            <div class="mainpomobox">

                <div class="topline">
                    <h2>Pomodoro</h2>
                    <div class=" closepomo">
                        <svg class="plannercross" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30"
                            height="30" color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"></path>
                        </svg>
                    </div>
                </div>

                <div class="mainpomo" style="padding: 10px 100px;">
                    <div class="timer" style="font-size: 40px;">25:00</div>
                    <div class="pomobtns">
                        <div class="pause">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="80"
                                height="80" color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                                stroke-linecap="round" stroke-linejoin="round">

                                </path>
                            </svg>
                        </div>
                        <div class="reset"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="80"
                                height="80" color="#000000" fill="none" stroke="currentColor" stroke-width="1"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18.0117 7.48959L19.5013 6"></path>
                                <path
                                    d="M5.51903 19C7.07817 20.8354 9.40308 22 12 22C16.6944 22 20.5 18.1944 20.5 13.5C20.5 8.80558 16.6944 5 12 5C7.30558 5 3.5 8.80558 3.5 13.5C3.5 14.0118 3.54524 14.5131 3.63193 15">
                                </path>
                                <path d="M14.5 2H9.5"></path>
                                <path d="M12 13.5L15.5 10"></path>
                                <path
                                    d="M8.5 18.2213C8.5 18.2213 5.21917 17.7234 4.72128 18.2213C4.22339 18.7192 4.72129 22 4.72129 22">
                                </path>
                            </svg></div>
                    </div>
                </div>
            </div>
        </div>

                    </div>
                </nav>

            <div class="quotesection">
                <div class="mainquote">
                    <div class="quote"
                        style=" font-family: Playfair Display ; font-size: large; text-transform: capitalize;"></div>
                    <div class="author" style="  font-family: Playfair Display; font-size: 14px; opacity: 0.6;"></div>
                </div>
            </div>

            <div class="centersection">

                <div class="greet" style="display: flex; flex-direction: column; align-items: center;">
                    <h1 class="hello" style="font-size: 30px;"></h1>
                    <h3 class="greetingtext" style="font-size: 14px ; opacity: 0.6;"></h3>
                </div>

                <div class="currenttime">
                    <div class="time">
                        <h1>9:00:12<sup>PM</sup></h1>
                    </div>
                    <div class="otherinfo">
                        <div class="day"></div>
                        <div class="date"></div>
                        <div class="temp"></div>
                        <div class="skycondition"></div>
                    </div>
                </div>
