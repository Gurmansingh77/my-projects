<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main>
    <header>
      <nav>
        <h1>E-COMM</h1>
        <button id="createproduct">Create product</button>
      </nav>
    </header>

    <!-- Only this part is changed -->
    <div class="products"></div>

  </main>

  <div class="form">
    <form action="">
      <div class="top">
        <h1 class="createh1">Create product</h1>

        <div class="crosssvg">
          <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="25"
            height="25"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5">
            <path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085"></path>
          </svg>
        </div>
      </div>

      <input required class="productname" type="text" placeholder="Product name" />
      <input required class="description" type="text" placeholder="Description" />
      <input required class="price" type="text" placeholder="Price" />
      <input required class="imgurl" type="text" placeholder="Image URL" />

      <button class="createbtn" type="submit">Create</button>
    </form>
  </div>

  <script src="script.js"></script>

</body>

</html>
